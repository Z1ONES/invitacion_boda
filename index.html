  <style>

    *{box-sizing:border-box;margin:0;padding:0}

    body{font-family:'VT323',monospace;background:radial-gradient(circle at 50% 12%,rgba(255,59,213,.18),transparent 32%),radial-gradient(circle at 85% 72%,rgba(24,215,255,.14),transparent 28%),linear-gradient(180deg,#050511,#08041b 54%,#03030c)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(24,215,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,59,213,.03) 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,.08));z-index:0}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px);mix-blend-mode:screen;opacity:.42;z-index:2}
    a,button{font:inherit;color:inherit}.screen{position:relative;z-index:3;min-height:100vh;display:grid;place-items:center;padding:22px}.noise{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:27px 27px;opacity:.18;animation:drift 9s linear infinite}.float{position:fixed;z-index:1;pointer-events:none;color:var(--pink);font-family:'Press Start 2P';text-shadow:0 0 18px currentColor;animation:float 4s ease-in-out infinite}.f1{left:7%;top:16%}.f2{right:8%;top:24%;color:var(--cyan);animation-delay:-1.3s}.f3{left:12%;bottom:15%;color:var(--purple);animation-delay:-2.1s}.f4{right:14%;bottom:18%;color:var(--pink);animation-delay:-.7s}
    .panel{width:min(900px,100%);border:2px solid rgba(24,215,255,.68);background:rgba(7,5,20,.82);box-shadow:0 0 0 1px rgba(255,255,255,.07),0 0 28px rgba(24,215,255,.18),0 0 62px rgba(255,59,213,.14);clip-path:polygon(0 22px,22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px));position:relative;overflow:hidden}
    .panel:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 38%,rgba(255,255,255,.12) 48%,transparent 58%);transform:translateX(-120%);animation:sweep 4.8s ease-in-out infinite;pointer-events:none}.title{font-family:'Press Start 2P';text-transform:uppercase;line-height:1.4;text-shadow:4px 4px 0 rgba(255,59,213,.32),0 0 18px rgba(24,215,255,.38)}.cyan{color:var(--cyan)}.pink{color:var(--pink)}.green{color:var(--green)}.yellow{color:var(--yellow)}.btn{cursor:pointer;border:2px solid var(--cyan);background:rgba(24,215,255,.08);color:var(--cyan);padding:15px 24px;font-family:'Press Start 2P';font-size:clamp(12px,2vw,17px);box-shadow:0 0 22px rgba(24,215,255,.24);clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px));transition:.18s ease;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px}.btn:hover,.btn.ready{transform:translateY(-2px);filter:brightness(1.2);box-shadow:0 0 28px rgba(255,59,213,.28),0 0 30px rgba(24,215,255,.28)}.btn.primary{border-color:var(--pink);background:rgba(255,59,213,.10);color:var(--pink)}
    .start-gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 32%,rgba(24,215,255,.2),transparent 28%),radial-gradient(circle at 50% 62%,rgba(255,59,213,.17),transparent 30%),rgba(3,3,12,.94);transition:opacity .45s ease,visibility .45s ease}.start-gate.hidden{opacity:0;visibility:hidden;pointer-events:none}.start-card{width:min(620px,100%);text-align:center;border:2px solid var(--cyan);background:rgba(7,5,20,.92);padding:clamp(22px,5vw,38px);box-shadow:0 0 30px rgba(24,215,255,.28),0 0 72px rgba(255,59,213,.18);clip-path:polygon(0 20px,20px 0,calc(100% - 20px) 0,100% 20px,100% calc(100% - 20px),calc(100% - 20px) 100%,20px 100%,0 calc(100% - 20px))}.start-card .title{font-size:clamp(20px,4.5vw,34px);color:var(--pink);margin-bottom:12px}.start-card p{font-size:clamp(22px,4vw,30px);color:var(--muted);margin:12px 0 22px}.boot-leds{display:flex;justify-content:center;gap:10px;margin:18px 0}.boot-leds span{width:12px;height:12px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:led 1s infinite steps(1)}.boot-leds span:nth-child(2){background:var(--pink);box-shadow:0 0 12px var(--pink);animation-delay:.15s}.boot-leds span:nth-child(3){background:var(--green);box-shadow:0 0 12px var(--green);animation-delay:.3s}
    .transition{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle,rgba(24,215,255,.2),transparent 28%),rgba(3,3,12,.96);opacity:0;visibility:hidden;transition:.35s ease}.transition.active{opacity:1;visibility:visible}.transition-card{width:min(520px,calc(100% - 28px));text-align:center;border:2px solid var(--pink);padding:26px;background:#070514;box-shadow:0 0 30px rgba(255,59,213,.34);clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px))}.load{height:14px;border:1px solid var(--cyan);margin-top:18px;padding:2px}.load span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 18px rgba(24,215,255,.55)}.transition.active .load span{animation:load 1.4s ease forwards}
    .terminal{padding:clamp(20px,4vw,34px)}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid rgba(24,215,255,.25);padding-bottom:14px;margin-bottom:20px;font-family:'Press Start 2P';font-size:clamp(9px,1.4vw,12px);color:var(--cyan)}.term-body{min-height:360px;font-family:'Press Start 2P';font-size:clamp(10px,1.75vw,15px);line-height:2.05;white-space:pre-wrap;color:var(--muted)}.cursor{display:inline-block;width:12px;height:1.05em;background:var(--pink);vertical-align:middle;margin-left:6px;animation:blink 1s steps(1) infinite;box-shadow:0 0 12px var(--pink)}
    @keyframes load{to{width:100%}}@keyframes drift{to{transform:translateY(-60px)}}@keyframes float{50%{transform:translateY(-10px) scale(1.08)}}@keyframes sweep{0%,40%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.55;filter:brightness(1.4)}}@keyframes led{50%{opacity:.35}}@media(max-width:640px){.screen{padding:14px}.panel,.start-card{clip-path:none;border-radius:18px}.btn{width:100%;font-size:12px}.float{display:none}.topbar{flex-direction:column}.term-body{min-height:340px}}

    /* Mobile/browser compatibility pass */
    html{min-height:-webkit-fill-available}
    body{min-height:100vh;min-height:100svh;touch-action:manipulation}
    button,.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .screen,.start-gate{min-height:100vh;min-height:100svh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
    .term-body{overflow-wrap:anywhere}.panel{max-height:calc(100svh - 28px);overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
    @supports (-webkit-touch-callout:none){body{background-attachment:scroll}.panel{max-height:calc(-webkit-fill-available - 28px)}}
    @media(max-width:430px){.terminal{padding:18px 14px}.term-body{min-height:300px;font-size:clamp(9px,2.75vw,12px);line-height:1.9}.start-card .title{font-size:clamp(18px,7vw,26px)}.transition-card{padding:22px 16px}.transition-card .title{font-size:clamp(15px,5vw,22px)}}
    @media(max-height:620px){.term-body{min-height:250px;line-height:1.75}.start-card{padding:20px}.boot-leds{margin:12px 0}.panel{max-height:none;overflow:hidden}}

<body>
  <audio id="boot" src="./musica/boot.wav" preload="auto"></audio>
  <audio id="success" src="./musica/success.wav" preload="auto"></audio>

  <div class="noise"></div><span class="float f1">♥</span><span class="float f2">+</span><span class="float f3">◆</span><span class="float f4">♥</span>

  <section id="startGate" class="start-gate">
    <div class="start-card">
      <div class="title">LOVE ARCADE OS</div>
      <div class="boot-leds" aria-hidden="true"><span></span><span></span><span></span></div>
      <button id="startBtn" class="btn primary" type="button">PRESS START</button>
    </div>
  </section>

  <main class="screen">
    <section class="panel terminal">
      <div class="topbar"><span>LOVE ARCADE OS</span><span>v14.11.2026</span><span class="green">CO-OP READY</span></div>
      <div id="term" class="term-body"></div><span class="cursor"></span>
    </section>
  </main>

  <div class="transition"><div class="transition-card"><div class="title pink">CARGANDO INVITACION</div><div class="load"><span></span></div></div></div>

  <script>
    const boot = document.getElementById('boot');
    const success = document.getElementById('success');
    const term = document.getElementById('term');
    const gate = document.getElementById('startGate');
    const startBtn = document.getElementById('startBtn');

    let launched = false;
    let booted = false;
    let i = 0;
    let j = 0;

    const lines = [
      'INICIANDO LOVE_ARCADE_OS...',
      '[OK] audio de inicio listo',
      '[OK] sistema de boda cargado',
      '[OK] jugador 1 detectado: FLOR',
      '[OK] jugador 2 detectado: KEKE',
      '[OK] modo co-op: ACTIVADO',
      '[OK] partida guardada: 14.11.2026',
      '',
      'EJECUTANDO boda.exe',
      '████████████████████ 100%',
      '',
      'NUEVA PARTIDA DESBLOQUEADA ♥'
    ];

    function playSound(audio, volume) {
      try {
        audio.currentTime = 0;
        audio.volume = volume;
        audio.play().catch(() => {});
      } catch (e) {}
    }
    function playSuccess() { playSound(success, .62); }
    let audioCtx;
    function tickTypingSound() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(720 + Math.random() * 90, audioCtx.currentTime);
        gain.gain.setValueAtTime(.035, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .035);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + .04);
      } catch (e) {}
    }

    function startSystem() {
      if (booted) return;
      booted = true;
      playSound(boot, .55);
      gate.classList.add('hidden');
      setTimeout(type, 520);
    }

    function go() {
      if (!booted) { startSystem(); return; }
      if (launched) return;
      launched = true;
      try { sessionStorage.setItem('playWeddingMusic', '1'); } catch (e) {}
      playSuccess();
      const t = document.querySelector('.transition');
      t.classList.add('active');
      setTimeout(() => { window.location.href = 'invitacion.html'; }, 1650);
    }

    function type() {
      if (i >= lines.length) {
        setTimeout(go, 520);
        return;
      }
      const line = lines[i];
      if (j <= line.length) {
        const char = line.charAt(j) || '';
        term.textContent += char;
        if (char && char !== ' ' && j % 2 === 0) tickTypingSound();
        j++;
        setTimeout(type, line.charAt(j - 1) === '█' ? 22 : 34);
      } else {
        term.textContent += '\n';
        i++;
        j = 0;
        setTimeout(type, 180);
      }
    }

    startBtn.addEventListener('click', startSystem);
    gate.addEventListener('click', (event) => {
      if (event.target === gate) startSystem();
    });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (!booted) startSystem(); else go();
      }
    });
  </script>
