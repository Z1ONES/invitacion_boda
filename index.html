  <style>
    :root {
      --bg-dark: #171411;
      --amber: #f4d35e;
      --amber-soft: #ffe9a8;
      --cream: #fff8ed;
      --olive: #6d7b47;
      --ink: #2d2a26;
      --terracotta: #cb7b5b;
      --card-strong: rgba(255, 251, 244, 0.86);
      --shadow: 0 10px 40px rgba(34, 25, 15, 0.12);
      --shadow-soft: 0 20px 60px rgba(85, 61, 31, 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body{
      font-family:'Inter',sans-serif;
      color:var(--ink);
      min-height:100vh;
      background: transparent;
      overflow-x:hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, rgba(255,255,255,0.32), transparent 36%),
        radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 60%);
      mix-blend-mode: screen;
      opacity: 0.55;
      z-index: 0;
    }

    .hidden { display: none !important; }
    body.is-transitioning {
      overflow: hidden;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
        radial-gradient(circle at center, rgba(244, 211, 94, 0.06), transparent 45%),
        var(--bg-dark);
      background-size: 100% 3px, 3px 100%, auto, auto;
      color: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #boot-screen.fade-out { opacity: 0; visibility: hidden; }
    body.is-transitioning #boot-screen {
      opacity: 0;
      transform: scale(1.015);
      filter: blur(8px);
    }

    .boot-shell {
      width: min(920px, 100%);
      min-height: 70vh;
      border: 1px solid rgba(244, 211, 94, 0.25);
      border-radius: 22px;
      background: rgba(8, 7, 6, 0.72);
      box-shadow: 0 0 0 1px rgba(244, 211, 94, 0.08), 0 0 60px rgba(244, 211, 94, 0.08);
      padding: 22px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
      transition: transform 2.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 2.8s ease, filter 2.8s ease;
    }
    body.is-transitioning .boot-shell {
      transform: scale(0.985) translateY(-8px);
      opacity: 0.2;
      filter: blur(4px);
    }

    .boot-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent, rgba(244, 211, 94, 0.03), transparent);
      animation: scan 4s linear infinite;
      background-position: center top;
      pointer-events: none;
    }

    @keyframes scan {
      from { transform: translateY(-100%); }
      to { transform: translateY(100%); }
    }

    .boot-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(244, 211, 94, 0.18);
      padding-bottom: 14px;
      margin-bottom: 18px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .boot-status { opacity: 0.75; }
    .boot-content {
      flex: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 1.7vw, 14px);
      line-height: 2;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: var(--amber);
      vertical-align: middle;
      animation: blink 1s step-end infinite;
      margin-left: 6px;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .boot-enter {
      margin-top: 18px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--amber-soft);
      opacity: 0;
      transform: translateY(10px);
      transition: 0.4s ease;
    }

    .boot-enter.visible { opacity: 1; transform: translateY(0); }

    #invitation {
      position: relative;
      min-height: 100vh;
      opacity: 0;
      transform: translateY(18px);
      transition: 1s ease;
    }

    #invitation.visible { opacity: 1; transform: translateY(0); }

    .bg-fixed,
    .decor-fixed {
      transition: opacity 0.18s ease, filter 0.22s ease;
    }

    body.is-transitioning .bg-fixed,
    body.is-transitioning .decor-fixed {
      opacity: 0;
      filter: blur(16px);
    }

    .scene-warp {
      position: fixed;
      inset: 0;
      z-index: 160;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 42%, rgba(244,211,94,0.14), transparent 24%),
        radial-gradient(circle at 18% 24%, rgba(203,123,91,0.10), transparent 18%),
        radial-gradient(circle at 82% 22%, rgba(109,123,71,0.10), transparent 18%),
        linear-gradient(180deg, rgba(16,13,10,0.54), rgba(12,10,8,0.96));
      transition: opacity 3.6s ease, visibility 3.6s ease;
    }
    .scene-warp::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 12px),
        linear-gradient(90deg, transparent 0%, rgba(244,211,94,0.12) 24%, rgba(255,248,214,0.20) 50%, rgba(244,211,94,0.12) 76%, transparent 100%);
      transform: scaleY(1.18);
      opacity: 0;
      transition: opacity 3.3s ease, transform 3.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scene-warp::after {
      content: "";
      position: absolute;
      inset: 10% 8%;
      border: 2px solid rgba(244,211,94,0.22);
      border-radius: 26px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 0 80px rgba(244,211,94,0.12);
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 3.3s ease, transform 3.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scene-warp.active {
      opacity: 1;
      visibility: visible;
    }
    .scene-warp.active::before {
      opacity: 1;
      transform: scaleY(1);
    }
    .scene-warp.active::after {
      opacity: 1;
      transform: scale(1);
    }
    .warp-card {
      position: relative;
      z-index: 1;
      width: min(520px, 100%);
      padding: 22px 24px;
      border-radius: 22px;
      border: 1px solid rgba(244,211,94,0.24);
      background: rgba(14, 11, 8, 0.72);
      color: var(--amber-soft);
      text-align: center;
      box-shadow: 0 0 0 1px rgba(244,211,94,0.08), 0 0 48px rgba(244,211,94,0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: translateY(18px) scale(0.96);
      opacity: 0;
      transition: transform 3s cubic-bezier(0.22, 1, 0.36, 1), opacity 3s ease;
    }
    .scene-warp.active .warp-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .warp-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--amber);
    }
    .warp-title {
      margin-top: 12px;
      font-family: 'Silkscreen', monospace;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.15;
      color: #fff5cf;
    }
    .warp-copy {
      margin-top: 10px;
      font-family: 'VT323', monospace;
      font-size: clamp(22px, 2.6vw, 28px);
      color: rgba(255,248,214,0.86);
    }
    .warp-bar {
      width: 100%;
      height: 14px;
      margin-top: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(244,211,94,0.18);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .warp-bar-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, rgba(244,211,94,0.56), rgba(255,248,214,0.96), rgba(244,211,94,0.62));
      box-shadow: 0 0 24px rgba(244,211,94,0.18);
      transition: width 3.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scene-warp.active .warp-bar-fill {
      width: 100%;
    }

    .texture {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(80,76,62,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,76,62,0.03) 1px, transparent 1px),
        radial-gradient(rgba(244,211,94,0.06) 1px, transparent 1px);
      background-size: 22px 22px, 22px 22px, 44px 44px;
      background-position: 0 0, 0 0, 8px 10px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.18));
      opacity: 0.72;
      z-index: 0;
    }

    .mediterranean-wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 24%, rgba(255,255,255,0.30), transparent 18%),
        radial-gradient(circle at 82% 28%, rgba(255,255,255,0.22), transparent 16%),
        radial-gradient(circle at 50% 70%, rgba(255,255,255,0.14), transparent 20%),
        linear-gradient(115deg, rgba(244,211,94,0.06), transparent 28%, rgba(109,123,71,0.05) 62%, transparent 100%),
        repeating-linear-gradient(90deg, rgba(109,123,71,0.018) 0 2px, transparent 2px 120px);
      opacity: 0.9;
    }

    .floating-lemon, .floating-leaf, .floating-pearl, .floating-ring,
    .pixel-star, .ui-panel-bg, .pixel-coin, .pixel-cloud,
    .pixel-path, .pixel-bush, .pixel-ui-node {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      filter: blur(0.2px);
    }

    .floating-lemon {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(18px, 2.3vw, 30px);
      opacity: 0.22;
      animation: floatY 8s ease-in-out infinite;
      image-rendering: pixelated;
      text-shadow:
        2px 0 0 rgba(244,211,94,0.22),
        -2px 0 0 rgba(244,211,94,0.18),
        0 2px 0 rgba(109,123,71,0.12),
        0 -2px 0 rgba(255,255,255,0.08);
    }

    .floating-leaf {
      width: 26px;
      height: 52px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(180deg, #91a564, #65783d);
      transform: rotate(30deg);
      opacity: 0.26;
      animation: drift 10s ease-in-out infinite;
    }

    .floating-pearl {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.85), rgba(255,255,255,0.18) 45%, transparent 70%);
      opacity: 0.28;
      animation: pulseOrb 11s ease-in-out infinite;
    }

    .floating-ring {
      border-radius: 50%;
      border: 1px solid rgba(212,177,92,0.16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      opacity: 0.50;
      animation: slowSpin 24s linear infinite;
    }

    .pixel-star {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 1vw, 14px);
      color: rgba(244,211,94,0.42);
      text-shadow: 0 0 10px rgba(244,211,94,0.12);
      animation: twinklePixel 5s ease-in-out infinite;
    }

    .pixel-coin {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(255,229,132,0.92), rgba(234,189,62,0.84));
      box-shadow:
        0 0 0 2px rgba(124,93,20,0.08),
        inset 0 2px 0 rgba(255,255,255,0.22),
        0 0 14px rgba(244,211,94,0.18);
      opacity: 0.34;
      animation: coinFloat 7s ease-in-out infinite;
    }

    .ui-panel-bg {
      border: 1px solid rgba(109,123,71,0.10);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      border-radius: 18px;
      opacity: 0.36;
      overflow: hidden;
    }

    .ui-panel-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(109,123,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(109,123,71,0.03) 1px, transparent 1px);
      background-size: 14px 14px, 14px 14px;
    }

    .ui-panel-bg::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, rgba(244,211,94,0.36), rgba(109,123,71,0.18), transparent 80%);
    }

    .pixel-cloud {
      width: 118px;
      height: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0.12));
      border-radius: 8px;
      opacity: 0.34;
      box-shadow:
        26px -10px 0 0 rgba(255,255,255,0.24),
        52px 0 0 0 rgba(255,255,255,0.28),
        78px -8px 0 0 rgba(255,255,255,0.18);
      animation: cloudMove 16s ease-in-out infinite;
    }

    .pixel-path {
      height: 18px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, rgba(244,211,94,0.18) 0 12px, rgba(255,243,204,0.10) 12px 24px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      opacity: 0.32;
      animation: pathPulse 6s ease-in-out infinite;
    }

    .pixel-bush {
      width: 46px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(133,160,88,0.58), rgba(90,118,56,0.48));
      box-shadow:
        12px -8px 0 0 rgba(133,160,88,0.42),
        24px 0 0 0 rgba(100,130,60,0.42),
        36px -6px 0 0 rgba(133,160,88,0.34);
      opacity: 0.28;
      animation: bushFloat 8s ease-in-out infinite;
    }

    .pixel-ui-node {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(244,211,94,0.55), rgba(202,161,52,0.44));
      box-shadow: 0 0 10px rgba(244,211,94,0.14);
      opacity: 0.34;
      animation: nodeBlink 4.8s ease-in-out infinite;
    }

    .lemon-1 { top: 12%; left: 5%; }
    .lemon-2 { top: 72%; right: 7%; animation-delay: -2s; }
    .lemon-3 { top: 38%; right: 12%; animation-delay: -4s; }
    .leaf-1 { top: 18%; right: 20%; }
    .leaf-2 { bottom: 14%; left: 10%; animation-delay: -3s; }
    .pearl-1 { top: 10%; right: 8%; }
    .pearl-2 { bottom: 4%; left: 4%; animation-delay: -5s; }
    .ring-1 { width: 320px; height: 320px; top: 14%; left: -80px; }
    .ring-2 { width: 240px; height: 240px; bottom: 8%; right: -60px; animation-direction: reverse; }
    .star-1 { top: 14%; left: 22%; }
    .star-2 { top: 32%; right: 16%; animation-delay: -2s; }
    .star-3 { bottom: 20%; left: 18%; animation-delay: -1s; }
    .star-4 { top: 58%; right: 26%; animation-delay: -3s; }
    .coin-1 { top: 22%; right: 9%; }
    .coin-2 { bottom: 18%; left: 8%; animation-delay: -2s; }
    .coin-3 { top: 64%; right: 12%; animation-delay: -4s; }
    .panel-1 { top: 12%; left: -20px; width: 180px; height: 110px; }
    .panel-2 { bottom: 10%; right: -16px; width: 210px; height: 130px; }
    .panel-3 { top: 44%; left: -30px; width: 140px; height: 84px; }
    .cloud-1 { top: 11%; left: 8%; }
    .cloud-2 { top: 19%; right: 14%; animation-delay: -6s; }
    .path-1 { top: 28%; left: 4%; width: 220px; }
    .path-2 { bottom: 18%; right: 4%; width: 240px; animation-delay: -2s; }
    .bush-1 { bottom: 14%; left: 18%; }
    .bush-2 { top: 56%; right: 8%; animation-delay: -3s; }
    .node-1 { top: 36%; left: 14%; }
    .node-2 { top: 42%; right: 18%; animation-delay: -1s; }
    .node-3 { bottom: 24%; left: 28%; animation-delay: -2.5s; }
    .node-4 { bottom: 30%; right: 22%; animation-delay: -3.2s; }

    @keyframes floatY { 0%,100% { transform: translateY(0) rotate(-2deg);} 50% { transform: translateY(-16px) rotate(3deg);} }
    @keyframes drift { 0%,100% { transform: translateY(0) rotate(30deg);} 50% { transform: translateY(-14px) rotate(22deg);} }
    @keyframes pulseOrb { 0%,100% { transform: scale(1) translateY(0); opacity: 0.2;} 50% { transform: scale(1.08) translateY(-12px); opacity: 0.32;} }
    @keyframes slowSpin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
    @keyframes twinklePixel { 0%,100% { opacity: 0.18; transform: translateY(0) scale(1);} 50% { opacity: 0.46; transform: translateY(-4px) scale(1.08);} }
    @keyframes coinFloat { 0%,100% { transform: translateY(0) rotate(0deg); opacity: 0.24;} 50% { transform: translateY(-10px) rotate(8deg); opacity: 0.42;} }
    @keyframes cloudMove { 0%,100% { transform: translateX(0) translateY(0); opacity: 0.18;} 50% { transform: translateX(12px) translateY(-6px); opacity: 0.34;} }
    @keyframes pathPulse { 0%,100% { opacity: 0.20; transform: scaleX(1);} 50% { opacity: 0.36; transform: scaleX(1.03);} }
    @keyframes bushFloat { 0%,100% { transform: translateY(0); opacity: 0.22;} 50% { transform: translateY(-5px); opacity: 0.30;} }
    @keyframes nodeBlink { 0%,100% { opacity: 0.18; transform: scale(1);} 50% { opacity: 0.42; transform: scale(1.2);} }

    .wrap { position: relative; z-index: 1; width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

    .hero {
      min-height: auto;
      display: grid;
      align-items: start;
      padding: 18px 0 40px;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0 3% auto;
      height: 52%;
      background: radial-gradient(circle at center, rgba(255,236,168,0.72), rgba(255,248,237,0.14) 55%, transparent 72%);
      filter: blur(18px);
      z-index: 0;
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 10%, rgba(244,211,94,0.14), transparent 16%),
        radial-gradient(circle at 12% 34%, rgba(203,123,91,0.07), transparent 16%),
        radial-gradient(circle at 88% 38%, rgba(109,123,71,0.08), transparent 16%);
      pointer-events: none;
      z-index: 0;
    }

    .hero-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: stretch;
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin: 0 auto;
    }

    .glass-card {
      background: linear-gradient(180deg, var(--card-strong), rgba(255, 247, 233, 0.76));
      border: 1px solid rgba(212, 177, 92, 0.35);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.42);
      backdrop-filter: blur(12px);
    }

    .hero-main {
      border-radius: 28px;
      padding: clamp(22px, 3vw, 38px);
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,251,244,0.94), rgba(255,246,231,0.82));
      box-shadow: 0 26px 46px rgba(64,54,32,0.10), inset 0 0 0 1px rgba(255,255,255,0.34);
    }

    .hero-main::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(109,123,71,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(109,123,71,0.025) 1px, transparent 1px),
        radial-gradient(circle at top right, rgba(244,211,94,0.16), transparent 20%),
        radial-gradient(circle at bottom left, rgba(203,123,91,0.08), transparent 18%);
      background-size: 16px 16px, 16px 16px, auto, auto;
      background-position: 0 0, 0 0, 100% 0, 0 100%;
      pointer-events: none;
    }

    .hero-main::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(109, 123, 71, 0.16);
      border-radius: 20px;
      pointer-events: none;
    }

    .hero-main .pixel-corner {
      position: absolute;
      width: 42px;
      height: 42px;
      border-top: 4px solid rgba(109,123,71,0.18);

    const bootEnter = document.getElementById('boot-enter');
    const bootScreen = document.getElementById('boot-screen');
    const sceneWarp = document.getElementById('scene-warp');
    const typingSfx = document.getElementById('typing-sfx');

    const prebootLines = [
      'CASAMIENTO-TROYANO',
      'Cargando entorno...'
    ];

    let bootFinished = false;
    let bootStarted = false;
    let invitationOpening = false;
    let lineIndex = 0;
    let charIndex = 0;

    function typeBoot() {
      if (lineIndex < bootLines.length) {
        const line = bootLines[lineIndex];
        if (charIndex < line.length) {
          bootText.textContent += line.charAt(charIndex);
          charIndex++;
          setTimeout(typeBoot, 32);
        } else {
          bootText.textContent += '\n';
          lineIndex++;
          charIndex = 0;
          setTimeout(typeBoot, 180);
        }
      } else {
        bootFinished = true;
        if (typingSfx) {
          typingSfx.pause();
          typingSfx.currentTime = 0;
        }
        bootEnter.classList.add('visible');
      }
    }

    function startTypingSound() {
      if (!typingSfx) return;
      typingSfx.volume = 0.22;
      typingSfx.currentTime = 0;
      const playPromise = typingSfx.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {});
      }
    }

    function startOriginalBoot() {
      if (bootStarted) return;
      bootStarted = true;
      startTypingSound();
      bootScreen.classList.remove('hidden');
      requestAnimationFrame(() => {
        prebootScreen.classList.add('fade-out');
      });
      setTimeout(() => {
        prebootScreen.classList.add('hidden');
        typeBoot();
      }, 620);
    }

    function openInvitation() {
      if (!bootFinished || invitationOpening) return;
      invitationOpening = true;
      if (typingSfx) {
        typingSfx.pause();
        typingSfx.currentTime = 0;
      }
      document.body.classList.add('is-transitioning');
      if (sceneWarp) sceneWarp.classList.add('active');
      setTimeout(() => {
        window.location.href = 'invitacion.html';
      }, 4000);
    }

    function typePrebootLine(element, text, speed = 42) {
      return new Promise((resolve) => {
        let i = 0;
        const tick = () => {
          if (i <= text.length) {
            element.textContent = text.slice(0, i);
            i += 1;
            setTimeout(tick, speed);
          } else {
            resolve();
          }
        };
        tick();
      });
    }

    function animatePrebootProgress() {
      return new Promise((resolve) => {
        let step = 0;
        const total = 10;
        const tick = () => {
          step += 1;
          prebootBarFill.style.width = `${step * 10}%`;
          prebootLine3.textContent = `${'█'.repeat(step)}${'░'.repeat(total - step)} ${step * 10}%`;
          if (step < total) {
            setTimeout(tick, 95);
          } else {
            prebootLine3.textContent = '██████████ 100%';
            resolve();
          }
        };
        tick();
      });
    }

    async function runPrebootIntro() {
      await typePrebootLine(prebootLine1, prebootLines[0], 46);
      await new Promise((r) => setTimeout(r, 180));
      await typePrebootLine(prebootLine2, prebootLines[1], 38);
      await new Promise((r) => setTimeout(r, 180));
      await animatePrebootProgress();
      await new Promise((r) => setTimeout(r, 120));
      prebootEnter.classList.add('visible');
    }

    document.body.style.overflow = 'hidden';
    runPrebootIntro();

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        if (!bootStarted) {
          e.preventDefault();
          startOriginalBoot();
          return;
        }
      }
      if (e.key === 'Enter') openInvitation();
    });

    prebootScreen.addEventListener('click', startOriginalBoot);
    prebootScreen.addEventListener('touchstart', startOriginalBoot, { passive: true });
    bootScreen.addEventListener('click', openInvitation);
  </script>

  </div>
</body>
</html>
